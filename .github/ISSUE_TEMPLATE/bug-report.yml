name: Report a bug
description: Report reproducible incorrect behavior in Col.
title: "Bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 134 on Windows 11
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or errors
      description: Drag files here and remove secrets or personal information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reproduced this on the latest version.
          required: true
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed secrets and personal information.
          required: true

name: Sponsorship inquiry
description: Ask about supporting Col.
title: "Sponsorship: "
body:
  - type: markdown
    attributes:
      value: This issue is public. Do not include private billing or contact details.
  - type: input
    id: organization
    attributes:
      label: Organization or project
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Public website
      placeholder: https://example.com
  - type: textarea
    id: proposal
    attributes:
      label: Sponsorship proposal
      description: Describe how you would like to support Col.
    validations:
      required: true
